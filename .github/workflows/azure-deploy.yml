name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: deeplearningprotocol-web
  AZURE_WEBAPP_PACKAGE_PATH: './DeepLearningProtocol.Web'
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ./DeepLearningProtocol.Web/DeepLearningProtocol.Web.csproj

    - name: Build
      run: dotnet build ./DeepLearningProtocol.Web/DeepLearningProtocol.Web.csproj --configuration Release --no-restore

    - name: Test
      run: dotnet test ./DeepLearningProtocol.Tests/DeepLearningProtocol.Tests.csproj --configuration Release --no-build --verbosity normal

    - name: Publish
      run: dotnet publish ./DeepLearningProtocol.Web/DeepLearningProtocol.Web.csproj --configuration Release --output ./publish

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish